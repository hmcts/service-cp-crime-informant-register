# The `test` profile — plain context-load tests only.
#
# It exists so tests that have nothing to do with messaging or persistence (ActuatorIntegrationTest
# and any future context-load test) keep running with no broker and no database, and therefore
# without Docker. Container-backed suites do NOT activate it: they boot the real configuration
# against Testcontainers.
informantregister:
  consumer:
    # Master switch for starting the Service Bus processor at all. Off here, so no test in this
    # profile ever tries to reach a broker.
    enabled: false
  servicebus:
    # Startup validation insists on exactly one credential source, and it is deliberately
    # unconditional: "the consumer happens to be off" is not a reason to let an ambiguous credential
    # configuration through. This is the same emulator string `application.yaml` carries as the local
    # default, and nothing in this profile ever connects with it.
    connection-string: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
  payload:
    # There is no cache and no query side in this profile, and nothing here fetches a payload. LIVE
    # would demand a system user identity at startup — correctly, since a live source without one
    # can never fetch anything — so the stub is selected explicitly. Startup refuses the stub on the
    # deployed credential source, and this profile carries the local one above.
    mode: STUB
  referencedata:
    # For the same reason: nothing in this profile addresses a register, so there is no reference
    # data to reach and no identity mounted to reach it with. LIVE would correctly refuse to start.
    mode: STUB

spring:
  autoconfigure:
    # No datasource is configured in this profile, and with the JDBC starter on the classpath
    # DataSourceAutoConfiguration would otherwise fail the context demanding a URL. Flyway's
    # auto-configuration is conditional on a DataSource and would back off on its own; it is
    # excluded explicitly so the reason is stated rather than inferred.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

management:
  otlp:
    metrics:
      export:
        # No collector is listening during a test, and the exporter's shutdown attempt writes a
        # connection warning into every suite's output. Turning it off here keeps the test log
        # readable; the deployed configuration is untouched.
        enabled: false
  endpoint:
    health:
      group:
        # The deployed readiness group is `db` (the store gates readiness, the broker never does).
        # Spring validates group membership at startup, so naming an absent `db` contributor here —
        # absent precisely because the datasource auto-configuration is excluded above — would fail
        # the context. `ping` keeps the group well formed and the endpoint shape identical.
        readiness:
          include: ping
