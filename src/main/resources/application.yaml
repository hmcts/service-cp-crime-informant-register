spring:
  application:
    name: service-cp-crime-informant-register

  # The processed-log store. Every value here is a LOCAL development default matching the `postgres`
  # service in docker-compose.yml; deployed environments override them from Key Vault through the
  # Secrets Store CSI driver, which reaches these keys by the usual relaxed-binding environment
  # variables (SPRING_DATASOURCE_URL and friends).
  datasource:
    url: jdbc:postgresql://localhost:5432/informantregister
    username: informantregister
    password: informantregister
    hikari:
      # Lazy pool initialisation: no connection is opened during context refresh, so the application
      # starts even with the store down. It has to — actuator must be up to report readiness DOWN
      # honestly, and a pod that cannot start cannot tell anyone why (research §7).
      initialization-fail-timeout: -1
      data-source-properties:
        # A store that dies without closing its connections would otherwise block the health probe
        # for ever, and intake would never suspend. Seconds, per the PostgreSQL JDBC driver.
        socketTimeout: 30

  flyway:
    # The Flyway bean is configured here; when the migration runs is a separate decision. The
    # lifecycle controller takes it off the context-refresh path and runs it on the first successful
    # store probe, before intake starts, so no message is ever consumed against an unmigrated schema.
    enabled: true

server:
  port: ${SERVER_PORT:8082}

informantregister:
  consumer:
    # The master switch for intake. Off in the `test` profile, so context-load tests need no broker.
    enabled: true

  servicebus:
    # NO packaged broker credential, deliberately (PackagedDefaultsTest pins this). Exactly one
    # source may be set and startup fails fast otherwise: `connection-string` for local and CI
    # (the emulator's development string — docker-compose.yml, the quickstart's bootRun exports
    # and the test suites each supply it themselves), or `namespace` for deployed environments
    # (workload identity). Packaging the emulator string here would force every deployed values
    # file to carry a blank override just to erase it — the exact line a reviewer tidies away.
    # connection-string: supplied by compose/quickstart/tests, never packaged.
    # namespace: set in deployed environments only, for workload identity.
    queue-name: informantregister.requests
    # Two concurrent deliveries, matching the Durable Functions throttle this service replaces.
    max-concurrent-calls: 2
    # Mirrors the broker queue's own setting. Used to recognise the final permitted delivery, so it
    # must be changed here and on the queue together.
    max-delivery-count: 5
    # Mirrors the broker queue's own LockDuration, which this service cannot read. The claim lease
    # must be strictly shorter, so a dead runner's claim has always lapsed by the time the broker
    # redelivers; validated at startup. 5m is the ASB maximum, and like max-delivery-count above it
    # must be changed here and on the queue together — moving the queue alone voids the rule
    # silently and a crashed pod's message starts burning its delivery budget again.
    lock-duration: 5m
    # Must be at least the processing deadline plus the fixed 30s renewal margin, so the broker lock
    # always outlives a legitimate run. Validated at startup.
    max-auto-lock-renew-duration: 5m
    # An unresolved connection error older than this, with no traffic since, stops being reported as
    # an outage: an idle queue produces no traffic, and absence of traffic is not a failure.
    health-staleness: 60s

  claim:
    # How long an acquired claim stays live, written as now() + lease by the database. Strictly
    # shorter than lock-duration above, by a 30s margin: a redelivery arriving on lock expiry must
    # find a crashed runner's claim already lapsed, or it abandons and — abandon having no back-off
    # — the remaining deliveries are consumed back-to-back into a broker-reasoned dead-letter.
    # Compound durations must be ISO-8601: Spring's simple format takes one value and one unit, so
    # `4m30s` will not bind. The repository renders this with toString() and Postgres reads the
    # ISO-8601 form as an interval.
    lease: PT4M30S
    # The enforced bound on a run. Strictly shorter than the lease, so a slow runner stops itself
    # before its claim can be reclaimed. Validated at startup.
    processing-deadline: 4m

  store:
    # How often the store is probed, driving the gated start and the resume after an outage.
    probe-interval: 10s

  results:
    # The results context, for both of its APIs — the query API the payload fallback reads from and
    # the command API the register is POSTed to. One deployment behind one internal mesh host, so
    # the context roots belong to each call's path rather than here.
    # LOCAL DEFAULT ONLY, and not a value chosen here: it is the baseUri the Results command API's own
    # RAML declares. Deployed environments set RESULTS_BASE_URL to the internal mesh host.
    base-url: ${RESULTS_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity. A secret: it arrives from Key Vault through the Secrets Store CSI
    # driver, so what is written here is the binding and never a value — the empty default leaves a
    # local run with no identity to borrow.
    # It is REQUIRED. The command is refused without it, so the service refuses to start without it
    # rather than dead-letter every hearing it is given, one 403 at a time — a local run that has no
    # identity to use has nothing to post with either. Named here rather than left to relaxed
    # binding: a variable a comment documents and no key reads is a deployment that sets it
    # correctly and still fails to start.
    system-user-id: ${INFORMANT_REGISTER_SYSTEM_USER_ID:}
    # Retry policy for the POST. Connect and read failures, 5xx and 429 are retried; any other 4xx is
    # a refusal and is never retried. The numbers are this service's own: the contract documents that
    # back-off happens, not how much of it, so they are configuration rather than constants.
    max-attempts: 4
    initial-backoff: 500ms
    # The ceiling on any wait, a server-supplied Retry-After included. Worst case must stay well
    # inside informantregister.claim.processing-deadline, or a run would still be waiting when its
    # claim is reclaimed.
    max-backoff: 20s
    connect-timeout: 5s
    read-timeout: 30s

  referencedata:
    # LIVE | STUB. LIVE is the reference-data query-API adapter and is what an environment that says
    # nothing gets: a service that has to be told where its register's recipients come from is a
    # service that will one day be deployed not asking. STUB is the refusing stub, for local runs and
    # for the container suites whose subject is settlement and the processed log rather than the
    # register's recipients; startup refuses it wherever the deployed credential source
    # (servicebus.namespace) is in use, because a pod that can never address a register parks every
    # hearing carrying one.
    mode: LIVE
    # LOCAL DEFAULT ONLY, and not a value chosen here: it is the baseUri the reference-data query
    # API's own RAML declares. Deployed environments set REFERENCEDATA_BASE_URL to the internal mesh
    # host. Its own key rather than a member of results.*, because it is a different deployment
    # behind a different host.
    base-url: ${REFERENCEDATA_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity, a secret from Key Vault via the Secrets Store CSI driver. It falls back
    # to this service's own identity because the function app threads a single `cjscppuid` through
    # both calls (ReferenceDataService.js:44), so an environment that mounts one identity is not
    # asked for a second; REFERENCEDATA_SYSTEM_USER_ID exists for the day reference data authorises
    # a different one. REQUIRED in LIVE mode: an anonymous query is refused every time, so the
    # service refuses to start rather than park every hearing that produced a register.
    system-user-id: ${REFERENCEDATA_SYSTEM_USER_ID:${INFORMANT_REGISTER_SYSTEM_USER_ID:}}
    # The function app's DEFAULT_PUBLISH_RETRY_COUNT and DEFAULT_PUBLISH_RETRY_INTERVAL
    # (AxiosRetryWrapper.js:10-11). This call goes through the same wrapper the payload fallback
    # does, so the rule is ported rather than redesigned — which includes the legacy's inverted
    # policy: a status at or below 429 is never retried, while a 5xx is.
    max-attempts: 3
    retry-interval: 1s
    connect-timeout: 5s
    # Shorter than the processing deadline on purpose, for the reason the payload read's is: a read
    # that outlives the deadline outlives the claim behind it.
    read-timeout: 30s

  stub:
    # NONE | TRANSIENT. Test and local profiles only: it is deliberately not a field in the message
    # and not an HTTP endpoint, either of which would be a production fault-injection surface.
    payload-failure-mode: NONE

  payload:
    # LIVE | STUB. LIVE is the cache-with-query-fallback adapter and is what an environment that
    # says nothing gets: a service that has to be told to fetch payloads is a service that will one
    # day be deployed not fetching them. It requires informantregister.results.system-user-id,
    # without which
    # its fallback cannot authorise. STUB is for local runs and for the container suites whose
    # subject is settlement and the processed log rather than the payload; startup refuses it
    # wherever the deployed credential source (servicebus.namespace) is in use.
    mode: LIVE
    redis:
      # LOCAL development defaults, matching the datasource above. Deployed environments override
      # the address and mount the key from Key Vault through the Secrets Store CSI driver.
      host: localhost
      port: 6379
      # password: deployed only, from Key Vault. Never committed.
      # TLS is off for a developer's local server and on everywhere it is deployed — with
      # certificates verified, which the function app disables (registered deviation 1).
      ssl: false
      # The prefix the producer writes the payload under. INT_ is this flow's; SJP hearings stay in
      # the NOWs function app and are out of scope.
      key-prefix: INT_
      connect-timeout: 5s
      command-timeout: 5s
    fallback:
      # The function app's DEFAULT_PUBLISH_RETRY_COUNT and DEFAULT_PUBLISH_RETRY_INTERVAL. Kept
      # because the retry rule is ported rather than redesigned.
      max-attempts: 3
      retry-interval: 1s
      connect-timeout: 5s
      # Shorter than the processing deadline on purpose: a read that outlives the deadline outlives
      # the claim behind it, and then two runners believe they own the same request.
      read-timeout: 30s

# Application Insights is configured by the Java agent (lib/applicationinsights.json).
# The per-environment connection string is supplied as APPLICATIONINSIGHTS_CONNECTION_STRING,
# mounted from Key Vault via the Secrets Store CSI driver; there is nothing to set here.
#
# Worth knowing, because it cannot be commented in JSON: the agent applies its own log threshold on
# top of whatever Logback emits, and it defaults to INFO. So if a future story ever lowers
# `logging.level` for a package to chase something, the agent's `instrumentation.logging.level`
# has to come down with it or the extra lines will reach container stdout and stop there. Raising a
# level and receiving nothing in Log Analytics is a worse failure than not being able to raise it.
#
# The transformation-tracing switch, when that is needed, is
# `uk.gov.hmcts.cp.informantregister.pipeline` at DEBUG: it turns on per-authority subscription
# matching and the reason each subscription was rejected. It needs a redeploy, deliberately —
# see the `loggers` note under `management.endpoints.web.exposure` below.

management:
  endpoints:
    web:
      base-path: /actuator
      # The whole HTTP surface of this service. There is no business API (spec FR-014).
      exposure:
        # `loggers` is deliberately NOT here, and HttpSurfaceTest enforces that. It is tempting —
        # it would let support raise a level during an incident instead of redeploying — but it is
        # a *write* surface on an actuator with no authentication, and the privacy rules this
        # service is held to only govern this service's own loggers. Anyone who could reach the pod
        # could raise io.lettuce or the JDBC logger to TRACE and put hearing payloads into the log
        # index, which is precisely the exposure Principle VII exists to prevent. Revisit if and
        # when the surface is authenticated.
        #
        # The support-critical facts are at INFO instead, which is the reason this stays closed
        # without costing an incident: the transformation refusal detail, the subscription counts
        # behind an unaddressed register, which source answered a payload read, the submission
        # outcome per authority, and the cause of a store outage are all INFO. What remains at
        # DEBUG is per-subscription rejection detail, and reaching that needs a redeploy.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Both custom indicators assemble detail that was unreachable while this defaulted to
      # `never`: readiness spans db and intakeStartup and answered a bare {"status":"DOWN"} with
      # no indication which of the two was down, while ServiceBusHealthIndicator's condition and
      # timestamps and IntakeStartupHealthIndicator's started/awaiting-store distinction went
      # nowhere. `always` rather than `when-authorized` because there is no authentication on this
      # surface: `when-authorized` would treat every caller as unauthorized and change nothing.
      # The values are bounded to condition names, state labels and timestamps — no PII, no
      # secrets — and the surface is actuator-only and Istio-internal with no ingress. Revisit
      # when Entra/JWT lands.
      show-details: always
      probes:
        enabled: true   # enables liveness / readiness groups
      group:
        readiness:
          # The store gates readiness, because processing is unsafe without it — and so does this
          # pod's own gated start, because a database that replies is not the same thing as a
          # service in a position to use it. Between them sits the deferred migration and the
          # processor, either of which can fail: a pod whose migration is throwing would otherwise
          # report ready, be sent traffic, count as a healthy replica in a rolling deployment, and
          # consume nothing while the queue grew.
          #
          # The `servicebus` indicator is deliberately absent from both: a broker blip must never
          # roll the pods, and the service cannot heal the queue by restarting (spec FR-011).
          include: db,intakeStartup

logging:
  level:
    root: INFO
