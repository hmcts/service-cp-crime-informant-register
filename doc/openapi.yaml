openapi: 3.1.0
info:
  title: "service-cp-crime-informant-register API"
  description: "Consumes hearing-resulted messages from a dedicated Azure Service Bus queue and produces per-authority informant register submissions (Option 2 lift-and-shift of the informant register function app)"
  version: 1.0.0
  contact:
    name: "Resulting Assistant"

servers:
  - url: http://localhost:8082
    description: Local development
  - url: https://service-cp-crime-informant-register.sit.platform.hmcts.net
    description: SIT environment

tags:
  - name: "DistributionCommand, ProcessedRequest, ProcessedOutput, RegisterFragment, InformantRegisterDocument"
