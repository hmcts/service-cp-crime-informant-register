# ---------------------------------------------------------------------------
# service-cp-crime-informant-register — intentionally EMPTY
#
# This service has NO REST API.
#
# It is a message-driven pipeline: it consumes hearing-resulted commands from the
# Azure Service Bus queue `informantregister.requests` and POSTs one
# `add-informant-register` command per prosecuting authority to cpp-context-results.
# The only HTTP surface it exposes is Spring Boot Actuator (health, info, metrics),
# which is operational and is not a contract with any consumer.
#
# There is therefore no OpenAPI specification to maintain, and no API-first gate.
# The two real contracts are documented in doc/API_CONTRACTS.md:
#
#   1. INBOUND  — the ASB queue message schema (owned by this service).
#                 Machine-readable schema:
#                 src/main/resources/contracts/distribution-command.schema.json
#   2. OUTBOUND — the `add-informant-register` command, owned by cpp-context-results
#                 (results-command-api.raml + informantRegisterDocumentRequest.json,
#                 media type application/vnd.results.add-informant-register+json,
#                 additionalProperties: false).
#
# Do NOT populate this file. Adding REST endpoints to this service is a design
# decision requiring an agreed story — see doc/TECHNICAL_DESIGN.md and
# .claude/rules/design_rules.md ("Out of Scope — do not build here").
#
# See also: doc/API_CONTRACTS.md
# ---------------------------------------------------------------------------
