name: CodeQL

on:
  pull_request:
    branches:
      - master
      - main
      - 'team/**'

  push:
    branches:
      - master
      - main
      - 'team/**'

  schedule:
    - cron: '36 5 * * 4'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: current

      - name: Gradle Build
        run: |
          ./gradlew build cyclonedxBom -x test

      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      #   If the (auto)build fails above, remove it and uncomment the following three lines.
      #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{matrix.language}}"

      - name: Log generated SBOM Hash
        run: sha256sum build/resources/main/META-INF/sbom/application.cdx.json || true

        # This ensures:
        # - The SBOM is archived with the CodeQL scan output
        # - It's available to download and inspect from the GitHub Actions UI
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: build/resources/main/META-INF/sbom/application.cdx.json

  DAST:
    runs-on: ubuntu-latest
    # zaproxy/action-baseline files a GitHub issue with the scan result by default
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: current

      - name: Gradle Build
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Debug DNS (temporary)
        run: |
          echo "== host /etc/resolv.conf";            cat /etc/resolv.conf
          echo "== host systemd upstream";            cat /run/systemd/resolve/resolv.conf || true
          echo "== resolvectl";                       resolvectl status || true
          echo "== host lookup";                      getent ahosts archive.ubuntu.com || true
          for h in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com ubuntu.com github.com registry-1.docker.io; do
            echo "== host getent $h"; getent ahostsv4 "$h" | head -2 || echo "FAILED rc=$?"
            echo "== resolvectl query $h"; resolvectl query "$h" 2>&1 | head -4 || true
            echo "== dig @168.63.129.16 $h"; dig +time=3 +tries=1 +short "$h" @168.63.129.16 2>&1 | head -3 || true
          done
          echo "== docker info (version/driver)";     docker version --format '{{.Server.Version}}'; docker buildx ls
          B=$(docker ps --filter name=buildx_buildkit -q)
          echo "== buildkit container ($B) resolv.conf"; docker exec "$B" cat /etc/resolv.conf || true
          echo "== buildkit container nslookup";      docker exec "$B" nslookup archive.ubuntu.com || true
          echo "== plain docker run (default bridge)"
          docker run --rm eclipse-temurin:25-jre sh -c 'cat /etc/resolv.conf; getent hosts archive.ubuntu.com' || true

      - name: DAST - Build and run containerised app
        run: |
          docker compose -f docker-compose.yml up -d

          echo "Waiting for health endpoint..."
          for i in {1..30}; do
            if curl -s http://localhost:8082/actuator/health > /dev/null; then
              echo "App is healthy"
              break
            fi
            echo "Waiting for app to be healthy ($i)..."
            sleep 2
          done

      - name: Run OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:8082"
          cmd_options: "-a -J zap_report.json -r zap_report.html"

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zap-html-report
          path: zap_report.html
