name: Code analysis

on:
  pull_request:
    branches:
      - master
      - main
      - 'team/**'

permissions:
  contents: read

jobs:
  pmd-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: current

      # PMD runs through the build's own gate (gradle/pmd.gradle), not the standalone PMD CLI
      # action it replaced. The Gradle task hands PMD the compiled classes as its auxclasspath,
      # so PMD can resolve types; several rules in this ruleset are answerable only with type
      # resolution, and silently misfire without it. On this repo the CLI action reported
      # IdenticalCatchBranches against catch blocks for unrelated exception types and
      # TooFewBranchesForSwitch against an exhaustive two-arm switch, none of which the build's
      # own gate reports. The action has no input for an auxclasspath, so the divergence could
      # not be closed by configuring it; running the build's task is what makes the two agree,
      # and it also drops the unpinned PMD version, which was free to float to a newer release
      # than the build uses. pmdMain fails the job on a real violation by itself
      # (ignoreFailures = false), so no separate violation-counting step is needed.
      - name: PMD (main sources)
        run: ./gradlew pmdMain

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pmd-report
          path: build/reports/pmd/
          if-no-files-found: ignore
