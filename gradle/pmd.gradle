apply plugin: 'pmd'

pmd {
  ruleSets = []
  ruleSetFiles = files(".github/pmd-ruleset.xml")
  ignoreFailures = false
  // Pinned so the gate is answerable. Unset, the Gradle plugin picks its own default, which
  // moves with the Gradle version rather than with any decision made here -- so a Gradle bump
  // silently changes which rules run, and a rule added in a new PMD release fails a build that
  // nobody changed. This is the version the Code analysis job runs, because that job now runs
  // this task; the two cannot drift apart again.
  toolVersion = "7.22.0"
}

tasks.named("pmdMain").configure {
  onlyIf { gradle.startParameter.taskNames.contains(name) }
}

// src/test gets its own ruleset -- the same base as main, minus rules that are inapplicable to
// test code or that report against this project's own test conventions. Every exclusion in that
// file names its reason. The task was disabled outright before, which meant the test sources -- a
// suite this service's correctness argument rests on, parity recordings included -- were the one
// part of the codebase no static analysis read at all.
tasks.named("pmdTest").configure {
  ruleSetFiles = files(".github/pmd-test-ruleset.xml")
}

tasks.withType(Pmd) {
  reports {
    xml.required.set(true)
    html.required.set(true)
  }
}

tasks.withType(Checkstyle).configureEach {
  def generatedDir = file("${layout.buildDirectory.get().asFile.absolutePath}/generated/src/main/java").canonicalPath
  source = source.filter { file ->
    !file.canonicalPath.startsWith(generatedDir)
  }
}
